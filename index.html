<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Runner</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #score { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; text-shadow: 2px 2px 0 #000; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; }
        #controls { position: absolute; bottom: 20px; width: 100%; text-align: center; display: flex; justify-content: center; gap: 20px; }
        .btn-control { width: 80px; height: 80px; background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid white; font-size: 30px; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
    </style>
</head>
<body>

    <div id="score">Score: 0</div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <button onclick="location.reload()">Try Again</button>
    </div>

    <div id="controls">
        <div class="btn-control" id="leftBtn">←</div>
        <div class="btn-control" id="rightBtn">→</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SETUP THE SCENE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);
        camera.rotation.x = -0.3;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. THE PLAYER ---
        const playerGeo = new THREE.BoxGeometry(1, 1, 1);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 }); // Green Player
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 0.5;
        scene.add(player);

        // Lane Logic: -2 (Left), 0 (Middle), 2 (Right)
        let currentLane = 0; 
        const laneWidth = 2.5;

        // --- 3. THE GROUND (Infinite Illusion) ---
        const floorGeo = new THREE.PlaneGeometry(20, 1000);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -450;
        scene.add(floor);

        // --- 4. OBSTACLES ---
        const obstacles = [];
        const obstacleGeo = new THREE.BoxGeometry(1, 1, 1);
        const obstacleMat = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Red Obstacles

        function spawnObstacle() {
            if(isGameOver) return;
            const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
            
            // Pick a random lane (-1, 0, 1) * laneWidth
            const laneIndex = Math.floor(Math.random() * 3) - 1; 
            obs.position.set(laneIndex * laneWidth, 0.5, -50); // Spawn far away
            
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- 5. GAME LOGIC ---
        let speed = 0.3;
        let score = 0;
        let isGameOver = false;
        let spawnTimer = 0;

        function update() {
            if (isGameOver) return;

            // Move Player smoothly to lane
            const targetX = currentLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 0.1;

            // Move Obstacles towards player
            spawnTimer++;
            if (spawnTimer > 40) { // Spawn rate
                spawnObstacle();
                spawnTimer = 0;
                speed += 0.001; // Increase speed over time
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += speed;

                // Collision Detection
                // Simple box distance check
                if (obs.position.z > -1 && obs.position.z < 1) {
                    if (Math.abs(obs.position.x - player.position.x) < 0.8) {
                        gameOver();
                    }
                }

                // Remove if behind camera
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = "Score: " + score;
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('controls').style.display = 'none';
        }

        // --- 6. CONTROLS ---
        function moveLeft() {
            if (currentLane > -1) currentLane--;
        }
        function moveRight() {
            if (currentLane < 1) currentLane++;
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });

        // Touch / Click Buttons
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        
        document.getElementById('leftBtn').addEventListener('mousedown', moveLeft);
        document.getElementById('rightBtn').addEventListener('mousedown', moveRight);

        // Start Loop
        update();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
